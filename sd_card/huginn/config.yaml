# Huginn-RF configuration — edit on a laptop, drop on the SD card root at /huginn/
# YAML-lite: 2-space indent, key: value, "- item" lists, # comments. No flow syntax.

core:
  device_name: huginn-01
  # Set true only once you understand docs/LEGAL.md. Offensive modules refuse
  # to transmit while this is false (you'll be prompted on-device instead).
  authorized_ack: false
  log_to_sd: true
  brightness: 160            # 0-255

radio:
  region: US915              # US915 | EU868 | AS923 | ...
  frequency_mhz: 915.0
  tx_power_dbm: 14           # keep legal for your region
  spreading_factor: 7
  bandwidth_khz: 125.0

gps:
  enabled: true
  baud: 9600

wardrive:
  # GPS-stamped logging of WiFi APs, BLE devices, and raw LoRa packets,
  # exported as a WiGLE-ingestible CSV. All passive (receive only).
  csv_prefix: wardrive
  min_rssi: -95              # ignore anything weaker than this (dBm)
  dedup_seconds: 30          # don't re-log the same source within N seconds
  log_wifi: true
  log_ble: true
  log_lora: false            # single-SF LoRa is opportunistic; off by default

recon:
  # Live "who's around" presence + lock-on RSSI proximity meter. Passive:
  # listens to 2.4 GHz WiFi activity (incl. phone probe requests) and BLE.
  # Note: modern phones randomize their MAC, so this locates a device in the
  # moment, not a named person over time. Authorized assessments only.
  forget_seconds: 60         # drop a device from the live list after N s unseen
  ble_every_seconds: 6       # interleave a short BLE scan this often
  min_rssi: -95

messenger:
  # AES-GCM encrypted point-to-point text over the configured frequency.
  channel: 7
  # Pre-shared key as 64 hex chars (32 bytes). CHANGE THIS. Empty = prompt on-device.
  psk_hex: ""
  callsign: anon

ir:
  codes_dir: /huginn/ir
  default_file: tvbgone.ir

wifi:
  authorized_ack_required: true
  # Evil Portal: SSID of the open AP, and the HTML template you supply. The
  # firmware serves whatever template you put here (it ships no brand spoof).
  portal_ssid: Free_WiFi
  portal_template: /huginn/portal/index.html
  # Targeted deauth burst size per keypress (hard-capped at 128 in firmware).
  # Scoped to a single AP you select from the scan list; authorized use only.
  deauth_burst: 32

ble:
  authorized_ack_required: true

badusb:
  payload_dir: /huginn/payloads/badusb
