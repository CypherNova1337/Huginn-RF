; Huginn-RF — modular pentest firmware for the M5Stack Cardputer ADV
; Target: ESP32-S3 (Cardputer ADV) + M5Stack LoRa-1262 cap (SX1262 + ATGM336H GPS)
;
; Notes on the board selection:
;   The Cardputer ADV is an ESP32-S3 device with 8MB flash / PSRAM. There is no
;   dedicated PlatformIO board for the ADV yet, so we start from the generic
;   S3 dev module and set the flash/PSRAM to match. If/when M5Stack ships an
;   official board JSON, swap `board` below for it.

[platformio]
default_envs = cardputer_adv
src_dir = src

[env:cardputer_adv]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

build_flags =
    -D HUGINN_VERSION=\"0.1.0-dev\"
    -D BOARD_CARDPUTER_ADV=1
    -D ARDUINO_USB_CDC_ON_BOOT=1      ; USB-CDC console (also needed for BadUSB HID switch)
    -D CORE_DEBUG_LEVEL=1
    -D ELECHOUSE_RADIOLIB=1

monitor_speed = 115200
upload_speed = 1500000

lib_deps =
    ; --- Display / device ---
    m5stack/M5Cardputer@^1.0.3
    m5stack/M5GFX@^0.2.3
    m5stack/M5Unified@^0.2.2
    ; --- Radio ---
    jgromes/RadioLib@^7.1.0          ; SX1262 driver (LoRa cap)
    ; --- GPS ---
    mikalhart/TinyGPSPlus@^1.0.3     ; ATGM336H NMEA parser
    ; --- Config / data ---
    bblanchon/ArduinoJson@^7.2.0     ; used by the YAML-lite loader for payload lists
    ; --- Crypto (messenger) ---
    rweather/Crypto@^0.4.0           ; AES / GCM for the encrypted messenger

; Optional: a second env for boards where the CC1101 sub-GHz module is wired
; in place of (or alongside) the LoRa cap. Enable HUGINN_HAS_CC1101 and wire
; the module to the Grove/GPIO header as documented in docs/HARDWARE.md.
[env:cardputer_adv_cc1101]
extends = env:cardputer_adv
build_flags =
    ${env:cardputer_adv.build_flags}
    -D HUGINN_HAS_CC1101=1
lib_deps =
    ${env:cardputer_adv.lib_deps}
    ; RadioLib already provides the CC1101 driver.
