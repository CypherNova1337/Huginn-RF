; Huginn-RF — modular pentest firmware for the M5Stack Cardputer ADV
; Target: ESP32-S3 (Cardputer ADV) + M5Stack LoRa-1262 cap (SX1262 + ATGM336H GPS)
;
; Envs:
;   cardputer_adv          core build: WiFi, BLE scan, LoRa suite, IR, BadUSB
;   cardputer_adv_full     adds BLE HID + RFID (needs the extra libs/hardware)
;   cardputer_adv_cc1101   adds CC1101 raw sub-GHz capture/replay
;
; There is no official PlatformIO board for the ADV yet, so we start from the
; generic S3 module and set flash/PSRAM to match. Swap `board` when M5 ships one.

[platformio]
default_envs = cardputer_adv
src_dir = src

[env]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
upload_speed = 1500000

build_flags =
    -D HUGINN_VERSION=\"0.2.0-dev\"
    -D BOARD_CARDPUTER_ADV=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1

lib_deps =
    m5stack/M5Cardputer@^1.0.3
    m5stack/M5GFX@^0.2.3
    m5stack/M5Unified@^0.2.2
    jgromes/RadioLib@^7.1.0
    mikalhart/TinyGPSPlus@^1.0.3
    bblanchon/ArduinoJson@^7.2.0
    rweather/Crypto@^0.4.0

; --- Core build ------------------------------------------------------------
[env:cardputer_adv]

; --- Full build: BLE HID + RFID -------------------------------------------
; Extra libs are only compiled when the matching HUGINN_* include is active
; (PlatformIO LDF chain mode), so they never bloat the core env.
[env:cardputer_adv_full]
build_flags =
    ${env.build_flags}
    -D HUGINN_ENABLE_BLE_HID=1
    -D HUGINN_HAS_RFID=1
lib_deps =
    ${env.lib_deps}
    t-vk/ESP32 BLE Keyboard@^0.3.2     ; BadBLE HID keyboard
    adafruit/Adafruit PN532@^1.3.3     ; 13.56 MHz RFID/NFC reader

; --- CC1101 sub-GHz variant ------------------------------------------------
[env:cardputer_adv_cc1101]
build_flags =
    ${env.build_flags}
    -D HUGINN_HAS_CC1101=1
