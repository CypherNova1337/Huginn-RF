; Huginn-RF — modular pentest firmware for the M5Stack Cardputer ADV
; Target: ESP32-S3 (Cardputer ADV) + M5Stack LoRa-1262 cap (SX1262 + ATGM336H GPS)
;
; Single build profile scoped to the hardware on hand: the ESP32-S3's WiFi/BLE,
; the built-in IR emitter, USB HID (BadUSB), the SD card, and the LoRa cap's
; SX1262 radio + ATGM336H GPS. No add-on-hardware modules (CC1101, PN532) are
; built; they can come back behind their own env when that hardware is added.
;
; There is no official PlatformIO board for the ADV yet, so we start from the
; generic S3 module and set flash to match. Swap `board` when M5 ships one.

[platformio]
default_envs = cardputer_adv
src_dir = src

[env:cardputer_adv]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
upload_speed = 1500000

build_flags =
    -D HUGINN_VERSION=\"0.2.0-dev\"
    -D BOARD_CARDPUTER_ADV=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1

lib_deps =
    m5stack/M5Cardputer@^1.0.3
    m5stack/M5GFX@^0.2.3
    m5stack/M5Unified@^0.2.2
    jgromes/RadioLib@^7.1.0
    mikalhart/TinyGPSPlus@^1.0.3
    bblanchon/ArduinoJson@^7.2.0
    rweather/Crypto@^0.4.0

; --- Experimental BadBLE build --------------------------------------------
; Same hardware, but the BLE HID keyboard stack doesn't share an image
; cleanly with the live BLE scanner, so "BadBLE" is its own flashable image.
; Enables the BLE HID path in modules/ble (keystroke injection over a paired
; BLE keyboard). Flash this when you want HID; flash cardputer_adv otherwise.
[env:cardputer_adv_badble]
extends = env:cardputer_adv
build_flags =
    ${env:cardputer_adv.build_flags}
    -D HUGINN_ENABLE_BLE_HID=1
lib_deps =
    ${env:cardputer_adv.lib_deps}
    t-vk/ESP32 BLE Keyboard@^0.3.2
